<text x="730.0" y="471.0" font-size="13" font-weight="normal" text-anchor="start" fill="#222222">m = riser face: no neighbor there, so mirror as a slip wall</text>
<line x1="40.0" y1="498.0" x2="1140.0" y2="498.0" stroke="#dddddd" stroke-width="1"/>
<text x="50.0" y="520.0" font-size="14" font-weight="normal" text-anchor="start" fill="#222222">• Each block is an ordinary CartesianGrid with its own storage and its own FvmSolver; the numerics never know they are in a multi-block case.</text>
<text x="50.0" y="545.0" font-size="14" font-weight="normal" text-anchor="start" fill="#222222">• The coupling lives entirely in a boundary condition (BlockInterfaceBoundary) that fills ghost cells from the neighbor block’s real cells.</text>
<text x="50.0" y="570.0" font-size="14" font-weight="normal" text-anchor="start" fill="#222222">• Same idea as an MPI halo exchange, but within one process: read the neighbor’s FieldView directly instead of send/receive.</text>
<text x="50.0" y="595.0" font-size="14" font-weight="normal" text-anchor="start" fill="#222222">• Verified: the numerical flux at the interface, computed from each block’s side, agrees bit-for-bit (conservative coupling).</text>
</svg>